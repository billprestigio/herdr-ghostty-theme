# Appearance fragment: merge into existing Ghostty config; macos-titlebar-style is macOS only.
font-family = "JetBrains Mono"
font-family = "Sarasa Mono SC"
font-size = 16
alpha-blending = linear
background = #11121b
foreground = #eae8ee
cursor-color = #eae8ee
cursor-text = #11121b
selection-background = #313244
selection-foreground = #eae8ee
palette = 0=#45475a
palette = 1=#f38ba8
palette = 2=#a6e3a1
palette = 3=#f9e2af
palette = 4=#cba6f7
palette = 5=#f5c2e7
palette = 6=#94e2d5
palette = 7=#d6d3dc
palette = 8=#85828d
palette = 9=#f38ba8
palette = 10=#a6e3a1
palette = 11=#f9e2af
palette = 12=#cba6f7
palette = 13=#f5c2e7
palette = 14=#94e2d5
palette = 15=#f4f2f5
background-opacity = 1.0
background-blur = 20
unfocused-split-opacity = 0.8
unfocused-split-fill = #11121b
split-divider-color = #323244
macos-titlebar-style = hidden
window-padding-x = 10
window-padding-y = 8
window-padding-color = background
window-theme = dark
cursor-style = block
cursor-style-blink = true
cursor-opacity = 1.0
